# Drives the four sync routes on a schedule.
#
# This exists because Vercel's Hobby plan allows at most 2 cron jobs and
# rejects any expression running more than once a day — see docs/SCHEDULING.md.
# On a Pro plan, delete this file and put the `crons` block in vercel.json
# instead; Vercel's scheduler is far more punctual than this one.
#
# TIMING CAVEAT, worth understanding before a live draft: GitHub delays
# scheduled workflows under load, sometimes by 10-30 minutes, and disables them
# entirely after 60 days of repo inactivity. sync-scores being late just means
# scores lag. apply-locks being late means rosters stay editable after kickoff,
# which is a competitive problem rather than a cosmetic one.
#
# SETUP — two repository secrets (Settings > Secrets and variables > Actions):
#   APP_URL       e.g. https://tds-only-public.vercel.app   (no trailing slash)
#   CRON_SECRET   the same value as the Vercel environment variable
name: sync

on:
  schedule:
    # Every job is gated on which of these fired, via github.event.schedule.
    - cron: "*/5 * * * *"    # apply-locks
    - cron: "*/30 * * * *"   # sync-scores
    - cron: "0 */6 * * *"    # sync-players
    - cron: "30 */12 * * *"  # sync-schedule
  workflow_dispatch:
    inputs:
      job:
        description: Which sync route to run
        required: true
        default: apply-locks
        type: choice
        options: [apply-locks, sync-scores, sync-players, sync-schedule]

# A slow run must not stack up behind the next tick.
concurrency:
  group: sync-${{ github.event.schedule || inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the route this tick is for
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.job }}
        run: |
          case "${SCHEDULE:-}" in
            "*/5 * * * *")   route=apply-locks ;;
            "*/30 * * * *")  route=sync-scores ;;
            "0 */6 * * *")   route=sync-players ;;
            "30 */12 * * *") route=sync-schedule ;;
            "")              route="${MANUAL}" ;;   # workflow_dispatch
            *)               echo "Unrecognised schedule '${SCHEDULE}'"; exit 1 ;;
          esac
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "Running $route"

      - name: Call the route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ROUTE: ${{ steps.pick.outputs.route }}
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "APP_URL and CRON_SECRET repository secrets must both be set."
            echo "See docs/SCHEDULING.md."
            exit 1
          fi

          # --max-time so a hung request cannot hold a runner for six hours.
          # Body goes to a file so a failure can print it without the secret
          # ever reaching the log.
          code=$(curl -sS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 300 \
            -o /tmp/body.json \
            -w '%{http_code}' \
            "${APP_URL}/api/cron/${ROUTE}") || {
              echo "curl failed to reach ${APP_URL}/api/cron/${ROUTE}"; exit 1; }

          echo "HTTP $code"
          # The routes report their own outcome in the body; it is the useful
          # part of the log and contains nothing sensitive.
          cat /tmp/body.json || true
          echo

          # A sync job that fails should turn the run red — a silently failing
          # scheduler that still shows green is worse than no scheduler.
          [ "$code" = "200" ]
